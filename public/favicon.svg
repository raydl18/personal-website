<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background with rounded corners -->
  <rect width="32" height="32" rx="6" fill="#002045"/>

  <!-- Blueprint grid dots (subtle, matches site aesthetic) -->
  <circle cx="4"  cy="4"  r="0.7" fill="#aec7f5" opacity="0.35"/>
  <circle cx="12" cy="4"  r="0.7" fill="#aec7f5" opacity="0.35"/>
  <circle cx="20" cy="4"  r="0.7" fill="#aec7f5" opacity="0.35"/>
  <circle cx="28" cy="4"  r="0.7" fill="#aec7f5" opacity="0.35"/>
  <circle cx="4"  cy="28" r="0.7" fill="#aec7f5" opacity="0.35"/>
  <circle cx="28" cy="28" r="0.7" fill="#aec7f5" opacity="0.35"/>

  <!-- RL monogram -->
  <text
    x="16" y="22"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="14"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-0.5"
  >RL</text>

  <!-- Steel blue accent bar -->
  <rect x="8" y="26" width="16" height="2" rx="1" fill="#3d57b6"/>
</svg>
